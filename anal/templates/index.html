<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>스팀 리뷰 분석하기</title>
    <link rel="stylesheet" href = "../static/style.css">
</head>
<body>
<div class="container">
    <div class="find-by-url">
        <input class="urlinput" placeholder="스팀 url 입력">
    </div>
    <div class="user-input">
        <input class="need" placeholder="원하는 게임 특징 입력">
        <button onclick="analyze()" class="analyze">분석</button>
    </div>
    <div class="game-card">
        <div class="game-image-box">
            <img class="game-image" src="" alt=""/>
        </div>
        <div class="game-info-box">
            <div class="title-section">
                <span class="game-title"></span>
            </div>
            <div class="score-section">
                <span class="game-score"></span>
            </div>
            <div class="info-section">
                <p class="info"> </p>
            </div>
        </div>
    </div>
</div>
<script src="../static/app.js"></script>
</body>
</html>
