<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>스팀 리뷰 분석하기</title>
    <link rel="stylesheet" href = "../static/style.css">
</head>
<body>
<div class="container">
    <div class="find-by-url">
        <input class="urlinput" placeholder="스팀 url 입력">
    <div class="survey-box">
        <div class="survey-item">
            <span>스토리</span>
            <input id="story" type="range" min="0" max="5" value="0">
        </div>
        <div class="survey-item">
            <span>난이도</span>
            <input id="difficulty" type="range" min="0" max="5" value="0">
        </div>
        <div class="survey-item">
            <span>액션성</span>
            <input id="action" type="range" min="0" max="5" value="0">
        </div>
        <div class="survey-item">
            <span>전략성</span>
            <input id="strategy" type="range" min="0" max="5" value="0">
        </div>
        <div class="survey-item">
            <span>자유도</span>
            <input id="free" type="range" min="0" max="5" value="0">
        </div>
        <div class="survey-item">
            <span>힐링도</span>
            <input id="calm" type="range" min="0" max="5" value="0">
        </div>
    </div>

    </div>
    <div class="user-input">
        <input class="need" placeholder="원하는 게임 특징 입력">
        <button onclick="analyze()" class="analyze">분석</button>
    </div>
    <div class="game-card">
        <div class="loading-overlay hidden">
            <div class="loading-box">
                <div class="spinner"></div>
                <p>분석 중입니다...</p>
            </div>
        </div>
        <div class="game-image-box">
            <img class="game-image" src="" alt=""/>
        </div>
        <div class="game-info-box">
            <div class="title-section">
                <span class="game-title"></span>
            </div>
            <div class="score-section">
                
            </div>
            <div class="need-score-section">
                <span class="game-score"></span>
            </div>
            <div class="info-para">
                <p class="info"></p>
            </div>
        </div>
    </div>
</div>
<script src="../static/app.js"></script>
</body>
</html>
